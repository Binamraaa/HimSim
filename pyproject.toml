[project]
name = "himalsim"
version = "0.2.0"
description = "Learning-oriented simulation toolkit for Himalayan glaciers and mass flows"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["numpy", "scipy", "pandas", "rasterio", "pyproj", "plotly", "streamlit"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["himalsim*"]

[tool.setuptools.package-data]
"himalsim.glacier" = ["outlines/*.geojson"]
"himalsim.climate" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
